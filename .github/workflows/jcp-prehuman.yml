name: JCP prehuman tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jcp-prehuman-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  godot-headless:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: godot-headless-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Run JCP suites
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          shopt -s nullglob
          tests=(tests/run_juego_cartas_propio_*.gd tests/run_jcp_table_*.gd)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No JCP test scripts found" >&2
            exit 1
          fi
          failures=0
          selected=0
          for index in "${!tests[@]}"; do
            if [ $((index % 4)) -ne "${SHARD}" ]; then
              continue
            fi
            test_script="${tests[${index}]}"
            if [ "${test_script}" = "tests/run_juego_cartas_propio_fusions_vertical.gd" ]; then
              continue
            fi
            selected=$((selected + 1))
            echo "::group::${test_script}"
            if [ "${test_script}" = "tests/run_jcp_table_activation_reveal.gd" ] || [ "${test_script}" = "tests/run_jcp_table_attack_gui.gd" ] || [ "${test_script}" = "tests/run_jcp_table_fusion_gui.gd" ]; then
              if ! xvfb-run -a "${GODOT}" --audio-driver Dummy --path . --script "${test_script}"; then
                echo "::error::Failed: ${test_script}"
                failures=$((failures + 1))
              fi
            elif ! "${GODOT}" --headless --path . --script "${test_script}"; then
              echo "::error::Failed: ${test_script}"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          printf 'Shard %s ran %d JCP scripts\n' "${SHARD}" "${selected}"
          if [ "${failures}" -ne 0 ]; then
            echo "${failures} JCP suite(s) failed in shard ${SHARD}" >&2
            exit 1
          fi

  fusion-vertical:
    name: fusion-vertical
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Run fusion vertical suite
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/run_juego_cartas_propio_fusions_vertical.gd
